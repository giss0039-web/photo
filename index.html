<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>施工照片報告產生器</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Microsoft JhengHei", sans-serif;
        }
        body {
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* 上方工具列 */
        .toolbar {
            background-color: white;
            width: 100%;
            max-width: 800px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            padding: 15px;
            box-shadow: 0 2px 12px 0 rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .upload-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #e4e7ed;
            padding-bottom: 12px;
            margin-bottom: 12px;
        }
        .upload-tips {
            font-size: 14px;
            color: #606266;
        }
        .upload-tips span {
            color: #e6a23c;
            margin-right: 5px;
        }
        .upload-tips p {
            margin: 5px 0 0 0;
            color: #909399;
            font-size: 12px;
        }
        .file-input-wrapper {
            position: relative;
            display: inline-block;
        }
        .btn-blue-outline {
            background: transparent;
            border: 1px solid #409eff;
            color: #409eff;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-blue-outline:hover {
            background: #ecf5ff;
        }
        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .btn-submit {
            background-color: #409eff;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }
        .btn-submit:hover {
            background-color: #66b1ff;
        }

        /* 下方 A4 預覽區面 */
        .a4-page {
            background-color: white;
            width: 210mm;
            min-height: 297mm;
            padding: 20mm 15mm;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }
        
        /* 表格樣式 */
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        th, td {
            border: 1.5px solid #000;
            padding: 8px;
            text-align: center;
            vertical-align: middle;
        }
        
        /* 標題與基本資料欄位 */
        .main-title {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 10px;
            padding: 12px;
        }
        .label-cell {
            font-weight: bold;
            font-size: 14px;
            width: 25%;
            background-color: #fafafa;
        }
        .input-cell {
            width: 75%;
            text-align: left;
        }
        .input-cell input[type="text"] {
            width: 100%;
            border: none;
            outline: none;
            font-size: 14px;
            color: #000;
            background: transparent;
        }

        /* 照片區塊 */
        .photo-row {
            height: 75mm;
        }
        .stage-cell {
            font-size: 18px;
            font-weight: bold;
            writing-mode: vertical-lr;
            letter-spacing: 5px;
            width: 25%;
            background-color: #fafafa;
        }
        .content-cell {
            width: 75%;
            position: relative;
            padding: 10px;
            text-align: right;
            vertical-align: top;
            height: 100%;
        }
        .date-picker-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            color: #606266;
            margin-bottom: 5px;
            position: relative;
            z-index: 10;
        }
        .date-picker-wrapper input[type="date"] {
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            padding: 3px 5px;
            color: #606266;
            outline: none;
        }
        
        /* 圖片容器與預覽 */
        .photo-container {
            position: absolute;
            top: 40px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 1px dashed #c0c4cc;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer;
            background-color: #fff;
        }
        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 確保步道相片按比例縮放，不變形 */
        }
        .image-placeholder {
            font-size: 13px;
            color: #909399;
            writing-mode: vertical-lr;
            letter-spacing: 2px;
            line-height: 1.5;
            text-align: center;
            pointer-events: none;
        }
        .photo-container:hover {
            border-color: #409eff;
        }
        .photo-container:hover .image-placeholder {
            color: #409eff;
        }

        /* 列印最佳化設定 */
        @media print {
            body {
                background-color: white;
                padding: 0;
            }
            .toolbar {
                display: none;
            }
            .a4-page {
                box-shadow: none;
                width: 210mm;
                height: 297mm;
                padding: 20mm 15mm;
                page-break-after: always;
            }
            .photo-container {
                border: none;
            }
        }
    </style>
</head>
<body>

    <!-- 上方操作面板 -->
    <div class="toolbar">
        <div class="upload-section">
            <div class="upload-tips">
                <div><span>★</span>批次上傳照片：</div>
                <p>選取多張照片，自動依序分配進施工前、中、後！</p>
            </div>
            <div class="file-input-wrapper">
                <button class="btn-blue-outline">選擇多張照片</button>
                <input type="file" id="batchUpload" multiple accept="image/*" onchange="handleBatchUpload(this)">
            </div>
        </div>
        <button class="btn-submit" onclick="window.print()">
            🖨️ 點我列印 / 存成 PDF 檔案
        </button>
    </div>

    <!-- 下方 A4 報告紙張 -->
    <div class="a4-page">
        <table>
            <!-- 大標題 -->
            <tr>
                <td colspan="2" class="main-title">施 工 照 片</td>
            </tr>
            <!-- 基本資料欄 -->
            <tr>
                <td class="label-cell">工程名稱</td>
                <td class="input-cell"><input type="text" value="新北市客家文化園區景觀設施及特色遊具工"></td>
            </tr>
            <tr>
                <td class="label-cell">承攬廠商</td>
                <td class="input-cell"><input type="text" value="嘉大興營造股份有限公司"></td>
            </tr>
            <tr>
                <td class="label-cell">施作項目</td>
                <td class="input-cell"><input type="text" value="施工圖錄"></td>
            </tr>
            
            <!-- 施工前 -->
            <tr class="photo-row">
                <td class="stage-cell">施工前</td>
                <td class="content-cell">
                    <div class="date-picker-wrapper">
                        <label>拍攝日期：</label>
                        <input type="date" value="2026-11-05">
                    </div>
                    <!-- 隱藏的 Input 移到外側防止結構被覆蓋 -->
                    <input type="file" id="imgInput1" accept="image/*" style="display:none;" onchange="previewSingle(this, 'preview1')">
                    <div class="photo-container" onclick="triggerSingleUpload('imgInput1')">
                        <div id="preview1" class="image-placeholder">點擊框內<br>上傳照片</div>
                    </div>
                </td>
            </tr>
            
            <!-- 施工中 -->
            <tr class="photo-row">
                <td class="stage-cell">施工中</td>
                <td class="content-cell">
                    <div class="date-picker-wrapper">
                        <label>拍攝日期：</label>
                        <input type="date" value="2026-11-05">
                    </div>
                    <input type="file" id="imgInput2" accept="image/*" style="display:none;" onchange="previewSingle(this, 'preview2')">
                    <div class="photo-container" onclick="triggerSingleUpload('imgInput2')">
                        <div id="preview2" class="image-placeholder">點擊框內<br>上傳照片</div>
                    </div>
                </td>
            </tr>
            
            <!-- 施工後 -->
            <tr class="photo-row">
                <td class="stage-cell">施工後</td>
                <td class="content-cell">
                    <div class="date-picker-wrapper">
                        <label>拍攝日期：</label>
                        <input type="date" value="2026-11-05">
                    </div>
                    <input type="file" id="imgInput3" accept="image/*" style="display:none;" onchange="previewSingle(this, 'preview3')">
                    <div class="photo-container" onclick="triggerSingleUpload('imgInput3')">
                        <div id="preview3" class="image-placeholder">點擊框內<br>上傳照片</div>
                    </div>
                </td>
            </tr>
