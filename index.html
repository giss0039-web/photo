<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>施工照片報告產生器</title>
    <!-- 引入 Bootstrap 5 提供排版樣式 -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <!-- 引入 html2pdf.js 用於前端轉存 PDF -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { background-color: #f8f9fa; font-family: "Microsoft JhengHei", sans-serif; padding-top: 20px; }
        .control-panel { max-width: 800px; margin: 0 auto 20px auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 8px; background-color: #fff; padding: 20px; border-top: 5px solid #0d6efd; }
        .page-container { background: #fff; width: 210mm; min-height: 297mm; padding: 20mm; margin: 0 auto 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.15); box-sizing: border-box; }
        .main-table { width: 100%; border-collapse: collapse; background: #fff; margin: 0; table-layout: fixed; }
        .main-table th, .main-table td { border: 1px solid #000; padding: 8px; font-size: 16px; font-family: "標楷體", "Microsoft JhengHei", serif; }
        .title-cell { text-align: center; font-weight: bold; font-size: 24px; letter-spacing: 10px; padding: 12px 0; }
        .label-cell { width: 18%; font-weight: bold; text-align: center; vertical-align: middle; background-color: #fff; }
        .content-cell { width: 82%; vertical-align: middle; padding: 5px 10px; }
        .content-cell input { width: 100%; border: none; font-size: 16px; font-family: "標楷體", sans-serif; padding: 4px; }
        .content-cell input:focus { outline: 1px dashed #0d6efd; background-color: #f0f7ff; }
        .stage-row { height: 240px; }
        .stage-label { width: 18%; text-align: center; vertical-align: middle; font-weight: bold; font-size: 20px; letter-spacing: 5px; line-height: 2; }
        .stage-photo-cell { width: 82%; text-align: center; padding: 10px; vertical-align: middle; position: relative; cursor: pointer; background-color: #fff; }
        .stage-photo-cell img { max-width: 100%; max-height: 210px; object-fit: contain; display: block; margin: 0 auto; }
        .date-container { text-align: right; font-size: 14px; margin-bottom: 5px; font-family: sans-serif; }
        .date-input { border: none; text-align: right; width: 150px; font-size: 14px; }
        .upload-placeholder { color: #aaa; font-size: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: right; padding-right: 20px; align-items: flex-end; }
        .page-break { page-break-before: always; margin-top: 30px; }
        @media print { body { background-color: #fff; padding: 0; } .control-panel { display: none; } .page-container { box-shadow: none; margin: 0; padding: 0; page-break-after: always; } }
    </style>
</head>
<body>

<!-- 頂部控制面板：完全符合您的原版配置 -->
<div class="control-panel">
    <h4 class="text-center fw-bold mb-3">施工照片報告產生器</h4>
    <div class="alert alert-info py-2 px-3 mb-3" style="font-size: 14px;">
        💡 <strong>批次上傳照片：</strong><br>
        選擇多張照片，自動每 3 張分配一頁 A4！
    </div>
    <div class="mb-3 d-flex justify-content-between align-items-center">
        <input type="file" id="batchPhotoInput" accept="image/*" multiple class="d-none" onchange="handleBatchUpload()">
        <button type="button" class="btn btn-outline-primary fw-bold" onclick="document.getElementById('batchPhotoInput').click()">選擇多張照片</button>
        <span id="uploadStatus" class="text-muted small">尚未選取照片</span>
    </div>
    <button type="button" class="btn btn-primary btn-lg w-100 fw-bold" onclick="generatePDFReport()">🖨️ 點我列印 / 存成 PDF 檔案</button>
</div>

<!-- 動態報告生成印刷區 -->
<div id="reportRenderArea">
    <!-- 預設顯示第一頁空表格，外觀完全復刻您的截圖 -->
    <div class="page-container" id="page_0">
        <table class="main-table">
            <tr><td colspan="2" class="title-cell">施 工 照 片</td></tr>
            <tr><td class="label-cell">工程名稱</td><td class="content-cell"><input type="text" class="sync-input-park" placeholder="請輸入工程名稱" value="新北市客家文化園區景觀設施及特色遊具工程"></td></tr>
            <tr><td class="label-cell">承攬廠商</td><td class="content-cell"><input type="text" class="sync-input-vendor" placeholder="請輸入承攬廠商" value="嘉大興營造股份有限公司"></td></tr>
            <tr><td class="label-cell">施作項目</td><td class="content-cell"><input type="text" class="sync-input-project" placeholder="請輸入本頁施作項目" value="施工圍籬"></td></tr>
            <tr class="stage-row">
                <td class="stage-label">施<br>工<br>前</td>
                <td class="stage-photo-cell" onclick="triggerSingleUpload(0, 0)">
                    <div class="date-container">拍攝日期：<input type="date" class="date-input" value="2026-11-05"></div>
                    <div id="img_container_0_0" class="upload-placeholder">點擊<br>框內<br>上傳<br>照片</div>
                </td>
            </tr>
            <tr class="stage-row">
                <td class="stage-label">施<br>工<br>中</td>
                <td class="stage-photo-cell" onclick="triggerSingleUpload(0, 1)">
                    <div class="date-container">拍攝日期：<input type="date" class="date-input" value="2026-11-05"></div>
                    <div id="img_container_0_1" class="upload-placeholder">點擊<br>框內<br>上傳<br>照片</div>
                </td>
            </tr>
            <tr class="stage-row">
                <td class="stage-label">施<br>工<br>後</td>
                <td class="stage-photo-cell" onclick="triggerSingleUpload(0, 2)">
                    <div class="date-container">拍攝日期：<input type="date" class="date-input" value="2026-11-05"></div>
                    <div id="img_container_0_2" class="upload-placeholder">點擊<br>框內<br>上傳<br>照片</div>
                </td>
            </tr>
        </table>
    </div>
</div>

<!-- 隱藏的獨立單張上傳觸發器 -->
<input type="file" id="singlePhotoInput" accept="image/*" class="d-none" onchange="handleSingleUpload()">

<script>
    // 🔒 隱藏的自動化 GitHub 連線金鑰
    const GISS_CONFIG = {
        token: "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",
        username: "giss0039-web",
        repo: "photo"
    };

    let allPhotoBase64Pool = [];
    let currentTargetPage = 0;
    let currentTargetStage = 0;

    // 處理多張照片批次上傳並每 3 張自動分一頁 A4
    function handleBatchUpload() {
        const files = document.getElementById('batchPhotoInput').files;
        if (!files.length) return;
        
        document.getElementById('uploadStatus').innerText = `正在讀取 ${files.length} 張照片...`;
        allPhotoBase64Pool = [];
        let loadedCount = 0;

        for (let i = 0; i < files.length; i++) {
            const reader = new FileReader();
            reader.onload = function(e) {
                allPhotoBase64Pool.push(e.target.result);
                loadedCount++;
                if (loadedCount === files.length) {
                    renderMultiPageReport();
                }
            };
            reader.readAsDataURL(files[i]);
        }
    }

    function renderMultiPageReport() {
        const renderArea = document.getElementById('reportRenderArea');
        const parkName = document.querySelector('.sync-input-park').value;
        const vendorName = document.querySelector('.sync-input-vendor').value;
        const workProject = document.querySelector('.sync-input-project').value;
        const todayStr = new Date().toISOString().split('T')[0];

        renderArea.innerHTML = '';
        const totalPhotos = allPhotoBase64Pool.length;
        const totalPages = Math.max(1, Math.ceil(totalPhotos / 3));
        const stageLabels = ["施<br>工<br>前", "施<br>工<br>中", "施<br>工<br>後"];

        for (let page = 0; page < totalPages; page++) {
            const pageDiv = document.createElement('div');
            pageDiv.className = `page-container ${page > 0 ? 'page-break' : ''}`;
            pageDiv.id = `page_${page}`;

            let tableHtml = `
                <table class="main-table">
                    <tr><td colspan="2" class="title-cell">施 工 照 片</td></tr>
                    <tr><td class="label-cell">工程名稱</td><td class="content-cell"><input type="text" class="sync-input-park" value="${parkName}" oninput="syncInputs('park', this.value)"></td></tr>
                    <tr><td class="label-cell">承攬廠商</td><td class="content-cell"><input type="text" class="sync-input-vendor" value="${vendorName}" oninput="syncInputs('vendor', this.value)"></td></tr>
                    <tr><td class="label-cell">施作項目</td><td class="content-cell"><input type="text" class="sync-input-project" value="${workProject}" oninput="syncInputs('project', this.value)"></td></tr>
            `;

            for (let stage = 0; stage < 3; stage++) {
                const photoIdx = page * 3 + stage;
                const imgSrc = (photoIdx < totalPhotos) ? allPhotoBase64Pool[photoIdx] : "";
                const cellContent = imgSrc ? `<img src="${imgSrc}">` : `<div id="img_container_${page}_${stage}" class="upload-placeholder">點擊<br>框內<br>上傳<br>照片</div>`;

                tableHtml += `
                    <tr class="stage-row">
                        <td class="stage-label">${stageLabels[stage]}</td>
                        <td class="stage-photo-cell" onclick="triggerSingleUpload(${page}, ${stage})">
                            <div class="date-container">拍攝日期：<input type="date" class="date-input" value="${todayStr}"></div>
                            ${cellContent}
                        </td>
                    </tr>
                `;
            }

            tableHtml += `</table>`;
            pageDiv.innerHTML = tableHtml;
            renderArea.appendChild(pageDiv);
        }
        document.getElementById('uploadStatus').innerText = `已成功排版 ${totalPhotos} 張照片（共 ${totalPages} 頁 A4）`;
    }

    function triggerSingleUpload(page, stage) {
        currentTargetPage = page;
        currentTargetStage = stage;
