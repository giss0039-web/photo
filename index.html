<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>施工照片報告</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @page {
            size: A4 portrait;
            margin: 0;
        }
        @media print {
            body { background: white; padding: 0; margin: 0; }
            .no-print { display: none !important; }
            input, textarea { border: none !important; background: transparent !important; resize: none !important; }
            .page-container {
                box-shadow: none !important;
                margin: 0 !important;
                padding: 12mm 15mm !important;
                height: 297mm !important;
                page-break-after: always;
                break-after: page;
            }
        }
        .page-container {
            page-break-after: always;
            break-after: page;
            box-sizing: border-box;
            width: 210mm;
            height: 297mm;
            margin: 0 auto 10px auto;
            background: white;
            padding: 12mm 15mm;
            display: flex;
            flex-direction: column;
        }
        
        /* 100% 擬真 Word/Excel 工程表格樣式 */
        .report-table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            border: 2px solid #000000;
            table-layout: fixed;
        }
        .report-table th, .report-table td {
            border: 1px solid #000000;
            padding: 0;
            margin: 0;
            vertical-align: middle;
            text-align: center;
        }
        
        .photo-box {
            width: 100%;
            height: 100%;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            background: #ffffff;
        }
        
        .photo-canvas {
            max-width: 92%;
            max-height: 220px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        .vertical-text {
            writing-mode: vertical-rl;
            letter-spacing: 6px;
            font-size: 16px;
            font-weight: 500;
            font-family: "標楷體", "DFKai-SB", "Microsoft JhengHei", serif;
            margin: 0 auto;
        }
    </style>
</head>
<body class="bg-gray-100 py-3 px-2">

    <!-- 全域控制列 (不印出) -->
    <div class="max-w-xl mx-auto mb-4 p-3 bg-white shadow rounded-xl no-print space-y-2 border border-gray-200">
        <h1 class="text-base font-bold text-center text-gray-800">施工照片報告產生器</h1>
        <div class="p-2.5 bg-blue-50 border border-blue-200 rounded-lg flex items-center justify-between gap-2">
            <div>
                <span class="font-bold text-blue-900 text-xs block">💡 批次上傳照片：</span>
                <span class="text-xs text-blue-700">選擇多張照片，自動每 3 張分配一頁 A4！</span>
            </div>
            <label class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-1.5 px-3 rounded text-xs cursor-pointer shadow whitespace-nowrap">
                選擇多張照片
                <input type="file" id="multiFiles" accept="image/*" multiple class="hidden" onchange="handleBatchImages(event)">
            </label>
        </div>
        <button onclick="window.print()" class="w-full bg-blue-600 text-white font-bold py-2.5 px-4 rounded-lg shadow hover:bg-blue-700 text-sm transition">
            🖨️ 點我列印 / 存成 PDF 檔案
        </button>
    </div>

    <!-- 輸出列印區域 -->
    <div id="print-area"></div>

    <script>
        const todayStr = new Date().toISOString().split('T')[0];
        let globalProject = '新北市客家文化園區景觀設施及特色遊具工程';
        let globalVendor = '嘉大興營造股份有限公司';
        let pagesData = [];

        // 初始化第 1 頁
        pagesData.push({
            item: '既有景石移設',
            dateBefore: todayStr, imgBefore: null,
            dateDuring: todayStr, imgDuring: null,
            dateAfter: todayStr, imgAfter: null
        });

        function renderAllPages() {
            const container = document.getElementById('print-area');
            container.innerHTML = '';

            pagesData.forEach((data, pIdx) => {
                const div = document.createElement('div');
                div.className = 'page-container shadow-xl rounded-sm';
                div.innerHTML = `
                    <table class="report-table">
                        <!-- 大標題 -->
                        <tr style="height: 42px;">
                            <th colspan="2" class="text-lg font-bold tracking-[10px] bg-white text-black font-serif" style="font-family: '標楷體', 'DFKai-SB', serif;">
                                施 工 照 片
                            </th>
                        </tr>
                        <!-- 工程名稱 -->
                        <tr style="height: 36px;">
                            <td class="w-[20%] font-semibold text-sm bg-white font-serif" style="font-family: '標楷體', serif;">工程名稱</td>
                            <td class="w-[80%] text-left px-2">
                                <input type="text" value="${globalProject}" placeholder="請輸入工程名稱" class="w-full outline-none text-sm font-serif bg-transparent" oninput="syncGlobalProject(this.value)">
                            </td>
                        </tr>
                        <!-- 承攬廠商 -->
                        <tr style="height: 36px;">
                            <td class="font-semibold text-sm bg-white font-serif" style="font-family: '標楷體', serif;">承攬廠商</td>
                            <td class="text-left px-2">
                                <input type="text" value="${globalVendor}" placeholder="請輸入承攬廠商" class="w-full outline-none text-sm font-serif bg-transparent" oninput="syncGlobalVendor(this.value)">
                            </td>
                        </tr>
                        <!-- 施作項目 (本頁獨立) -->
                        <tr style="height: 36px;">
                            <td class="font-semibold text-sm bg-white font-serif" style="font-family: '標楷體', serif;">施作項目</td>
                            <td class="text-left px-2">
                                <input type="text" value="${data.item}" placeholder="請輸入施作項目" class="w-full outline-none text-sm font-serif bg-transparent" oninput="pagesData[${pIdx}].item = this.value">
                            </td>
                        </tr>
                        <!-- 施工前 -->
                        <tr style="height: 30%;">
                            <td class="bg-white">
                                <div class="vertical-text">施工前</div>
                            </td>
                            <td>
                                <div class="photo-box" onclick="triggerFileInput(${pIdx}, 'Before')">
                                    <input type="file" id="file_${pIdx}_Before" accept="image/*" class="hidden" onchange="handleImageUpload(event, ${pIdx}, 'Before')">
                                    <canvas id="canvas_${pIdx}_Before" class="photo-canvas ${data.imgBefore ? '' : 'hidden'}"></canvas>
                                    ${!data.imgBefore ? '<span class="text-xs text-gray-400 no-print">點擊上傳【施工前】照片</span>' : ''}
                                </div>
                            </td>
                        </tr>
                        <!-- 施工中 -->
                        <tr style="height: 30%;">
                            <td class="bg-white">
                                <div class="vertical-text">施工中</div>
                            </td>
                            <td>
                                <div class="photo-box" onclick="triggerFileInput(${pIdx}, 'During')">
                                    <input type="file" id="file_${pIdx}_During" accept="image/*" class="hidden" onchange="handleImageUpload(event, ${pIdx}, 'During')">
                                    <canvas id="canvas_${pIdx}_During" class="photo-canvas ${data.imgDuring ? '' : 'hidden'}"></canvas>
                                    ${!data.imgDuring ? '<span class="text-xs text-gray-400 no-print">點擊上傳【施工中】照片</span>' : ''}
                                </div>
                            </td>
                        </tr>
                        <!-- 施工後 -->
                        <tr style="height: 30%;">
                            <td class="bg-white">
                                <div class="vertical-text">施工後</div>
                            </td>
                            <td>
                                <div class="photo-box" onclick="triggerFileInput(${pIdx}, 'After')">
                                    <input type="file" id="file_${pIdx}_After" accept="image/*" class="hidden" onchange="handleImageUpload(event, ${pIdx}, 'After')">
                                    <canvas id="canvas_${pIdx}_After" class="photo-canvas ${data.imgAfter ? '' : 'hidden'}"></canvas>
                                    ${!data.imgAfter ? '<span class="text-xs text-gray-400 no-print">點擊上傳【施工後】照片</span>' : ''}
                                </div>
                            </td>
                        </tr>
                    </table>
                `;
                container.appendChild(div);

                if (data.imgBefore) drawCanvas(pIdx, 'Before');
                if (data.imgDuring) drawCanvas(pIdx, 'During');
                if (data.imgAfter) drawCanvas(pIdx, 'After');
            });
        }

        function triggerFileInput(pIdx, type) {
            document.getElementById(`file_${pIdx}_${type}`).click();
        }

        function syncGlobalProject(val) {
            globalProject = val;
            document.querySelectorAll('input[placeholder="請輸入工程名稱"]').forEach(input => input.value = val);
        }

        function syncGlobalVendor(val) {
            globalVendor = val;
            document.querySelectorAll('input[placeholder="請輸入承攬廠商"]').forEach(input => input.value = val);
        }

        function handleBatchImages(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            const totalPages = Math.ceil(files.length / 3);
            
            while (pagesData.length < totalPages) {
                pagesData.push({
                    item: pagesData[0].item || '',
                    dateBefore: todayStr, imgBefore: null,
                    dateDuring: todayStr, imgDuring: null,
                    dateAfter: todayStr, imgAfter: null
                });
            }
            pagesData = pagesData.slice(0, totalPages);

            let fileIdx = 0;
            const stages = ['Before', 'During', 'After'];

            for (let p = 0; p < totalPages; p++) {
                for (let s = 0; s < 3; s++) {
                    if (fileIdx < files.length) {
                        const file = files[fileIdx++];
                        const stage = stages[s];
                        const reader = new FileReader();
                        
                        reader.onload = (function(pIdx, stg) {
                            return function(e) {
                                const img = new Image();
                                img.onload = function() {
                                    pagesData[pIdx]['img' + stg] = img;
                                    drawCanvas(pIdx, stg);
                                };
                                img.src = e.target.result;
                            };
                        })(p, stage);
                        reader.readAsDataURL(file);
                    }
                }
            }
            renderAllPages();
        }

        function handleImageUpload(event, pIdx, type) {
            event.stopPropagation();
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    pagesData[pIdx]['img' + type] = img;
                    drawCanvas(pIdx, type);
                    renderAllPages();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function drawCanvas(pIdx, type) {
            const data = pagesData[pIdx];
            const img = data['img' + type];
            if (!img) return;

            const canvas = document.getElementById(`canvas_${pIdx}_${type}`);
            if (!canvas) return;

            const dateVal = data['date' + type] || todayStr;
            const ctx = canvas.getContext('2d');
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);

            // 在照片右下角加上壓印日期 (格式: YYYY.MM.DD)
            if (dateVal) {
                const formattedDate = dateVal.replace(/-/g, '.');
                const fontSize = Math.max(canvas.width * 0.038, 18);
                ctx.font = `bold ${fontSize}px Arial, sans-serif`;
                ctx.fillStyle = '#FFC000'; // 黃色壓印字體
                ctx.shadowColor = '#000000';
                ctx.shadowBlur = 4;
                ctx.lineWidth = 2;

                const metrics = ctx.measureText(formattedDate);
                const x = canvas.width - metrics.width - 20;
                const y = canvas.height - 20;

                ctx.strokeText(formattedDate, x, y);
                ctx.fillText(formattedDate, x, y);
            }
            canvas.classList.remove('hidden');
        }

        // 初始化第一頁畫面
        renderAllPages();
    </script>

</body>
</html>
