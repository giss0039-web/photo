<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>施工照片報告</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @media print {
            body { background: white; padding: 0; margin: 0; }
            .no-print { display: none !important; }
            input, textarea { border: none !important; background: transparent !important; resize: none !important; }
            .page-container {
                box-shadow: none !important;
                margin: 0 !important;
                padding: 5mm !important;
                page-break-after: always;
                break-after: page;
            }
        }
        .page-container {
            page-break-after: always;
            break-after: page;
            box-sizing: border-box;
            width: 100%;
            max-width: 210mm;
            margin: 0 auto 10px auto;
            background: white;
            padding: 8mm;
        }
        /* 嚴格限制照片高度與比例，確保 3 張照片緊湊不超線 */
        .photo-canvas {
            width: 100% !important;
            height: 90px !important;
            max-height: 90px !important;
            object-fit: contain;
            display: block;
            margin: 0 auto;
            background: #f9fafb;
        }
    </style>
</head>
<body class="bg-gray-100 py-2 px-2">

    <!-- 全域控制列 (不印出) -->
    <div class="max-w-2xl mx-auto mb-3 p-3 bg-white shadow rounded-xl no-print space-y-2">
        <h1 class="text-base font-bold text-center text-gray-800">施工照片批次產生器</h1>
        <div class="p-2.5 bg-blue-50 border border-blue-200 rounded-lg flex items-center justify-between">
            <div>
                <span class="font-bold text-blue-800 text-xs block">💡 批次上傳多張照片：</span>
                <span class="text-xs text-blue-600">一次選取多張照片，系統會自動每 3 張一頁分配到 A4！</span>
            </div>
            <label class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-1.5 px-3 rounded text-xs cursor-pointer shadow whitespace-nowrap">
                選擇多張照片
                <input type="file" id="multiFiles" accept="image/*" multiple class="hidden" onchange="handleMultiImages(event)">
            </label>
        </div>
        <div class="flex justify-center gap-2">
            <button onclick="window.print()" class="bg-blue-600 text-white font-bold py-1.5 px-5 rounded shadow hover:bg-blue-700 text-xs transition">
                列印 / 存成 PDF 檔案
            </button>
        </div>
    </div>

    <!-- 輸出列印區域 -->
    <div id="print-area">
        <!-- 預設第 0 頁 -->
        <div class="page-container shadow-lg rounded-xl" data-page-index="0">
            <div>
                <h1 class="text-base font-bold text-center text-gray-800 mb-2 border-b pb-1">施工照片</h1>
                <div class="mb-3 text-xs">
                    <label class="block font-semibold text-gray-700 mb-0.5">工程名稱：</label>
                    <input type="text" placeholder="請輸入工程名稱" class="project-name-input w-full border border-gray-300 rounded p-1.5 outline-none" oninput="syncProject(this.value)">
                </div>
            </div>
            <div class="border border-gray-300 rounded overflow-hidden">
                <table class="w-full border-collapse" style="table-layout: fixed;">
                    <thead>
                        <tr class="bg-gray-100 text-gray-700 text-xs">
                            <th class="border border-gray-300 p-1.5 w-[25%]">階段 / 說明</th>
                            <th class="border border-gray-300 p-1.5 w-[75%]">照片與施工日期</th>
                        </tr>
                    </thead>
                    <tbody class="text-xs">
                        <!-- 施工前 -->
                        <tr>
                            <td class="border border-gray-300 p-1.5 bg-gray-50 align-top">
                                <span class="font-bold text-blue-600 block mb-0.5">【施工前】</span>
                                <textarea rows="2" placeholder="請輸入說明..." class="w-full border border-gray-300 rounded p-1 text-xs outline-none bg-white resize-none" oninput="formData[0].descBefore = this.value"></textarea>
                            </td>
                            <td class="border border-gray-300 p-1.5 space-y-1 align-middle">
                                <div class="flex items-center gap-1.5 no-print">
                                    <span class="font-semibold text-gray-600 whitespace-nowrap text-xs">日期:</span>
                                    <input type="date" id="date_0_Before" class="border border-gray-300 rounded p-0.5 text-xs outline-none w-full bg-white" onchange="updateDate(0, 'Before', this.value)">
                                </div>
                                <div class="no-print">
                                    <input type="file" accept="image/*" class="w-full text-xs" onchange="handleSingleImage(event, 0, 'Before')">
                                </div>
                                <div class="text-center">
                                    <canvas id="canvas_0_Before" class="hidden photo-canvas mx-auto rounded border shadow-sm"></canvas>
                                </div>
                            </td>
                        </tr>
                        <!-- 施工中 -->
                        <tr>
                            <td class="border border-gray-300 p-1.5 bg-gray-50 align-top">
                                <span class="font-bold text-yellow-600 block mb-0.5">【施工中】</span>
                                <textarea rows="2" placeholder="請輸入說明..." class="w-full border border-gray-300 rounded p-1 text-xs outline-none bg-white resize-none" oninput="formData[0].descDuring = this.value"></textarea>
                            </td>
                            <td class="border border-gray-300 p-1.5 space-y-1 align-middle">
                                <div class="flex items-center gap-1.5 no-print">
                                    <span class="font-semibold text-gray-600 whitespace-nowrap text-xs">日期:</span>
                                    <input type="date" id="date_0_During" class="border border-gray-300 rounded p-0.5 text-xs outline-none w-full bg-white" onchange="updateDate(0, 'During', this.value)">
                                </div>
                                <div class="no-print">
                                    <input type="file" accept="image/*" class="w-full text-xs" onchange="handleSingleImage(event, 0, 'During')">
                                </div>
                                <div class="text-center">
                                    <canvas id="canvas_0_During" class="hidden photo-canvas mx-auto rounded border shadow-sm"></canvas>
                                </div>
                            </td>
                        </tr>
                        <!-- 施工完 -->
                        <tr>
                            <td class="border border-gray-300 p-1.5 bg-gray-50 align-top">
                                <span class="font-bold text-green-600 block mb-0.5">【施工完】</span>
                                <textarea rows="2" placeholder="請輸入說明..." class="w-full border border-gray-300 rounded p-1 text-xs outline-none bg-white resize-none" oninput="formData[0].descAfter = this.value"></textarea>
                            </td>
                            <td class="border border-gray-300 p-1.5 space-y-1 align-middle">
                                <div class="flex items-center gap-1.5 no-print">
                                    <span class="font-semibold text-gray-600 whitespace-nowrap text-xs">日期:</span>
                                    <input type="date" id="date_0_After" class="border border-gray-300 rounded p-0.5 text-xs outline-none w-full bg-white" onchange="updateDate(0, 'After', this.value)">
                                </div>
                                <div class="no-print">
                                    <input type="file" accept="image/*" class="w-full text-xs" onchange="handleSingleImage(event, 0, 'After')">
                                </div>
                                <div class="text-center">
                                    <canvas id="canvas_0_After" class="hidden photo-canvas mx-auto rounded border shadow-sm"></canvas>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const formData = {};
        const todayStr = new Date().toISOString().split('T')[0];

        // 初始化第 0 頁
        formData[0] = {
            project: '',
            descBefore: '', dateBefore: todayStr, imgBefore: null,
            descDuring: '', dateDuring: todayStr, imgDuring: null,
            descAfter: '', dateAfter: todayStr, imgAfter: null
        };
        document.getElementById('date_0_Before').value = todayStr;
        document.getElementById('date_0_During').value = todayStr;
        document.getElementById('date_0_After').value = todayStr;

        function getPageData(pageIndex) {
            if (!formData[pageIndex]) {
                formData[pageIndex] = {
                    project: formData[0] ? formData[0].project : '',
                    descBefore: '', dateBefore: todayStr, imgBefore: null,
                    descDuring: '', dateDuring: todayStr, imgDuring: null,
                    descAfter: '', dateAfter: todayStr, imgAfter: null
                };
            }
            return formData[pageIndex];
        }

        function syncProject(val) {
            document.querySelectorAll('.project-name-input').forEach((input, idx) => {
                input.value = val;
                getPageData(idx).project = val;
            });
        }

        function updateDate(pageIndex, type, val) {
            const data = getPageData(pageIndex);
            data['date' + type] = val;
            renderCanvas(pageIndex, type);
        }

        function createNewPage(pageIndex) {
            const container = document.getElementById('print-area');
            const globalProject = getPageData(0).project;
            const pData = getPageData(pageIndex);
            pData.project = globalProject;

            const div = document.createElement('div');
            div.className = 'page-container shadow-lg rounded-xl';
            div.setAttribute('data-page-index', pageIndex);
            div.innerHTML = `
                <div>
                    <h1 class="text-base font-bold text-center text-gray-800 mb-2 border-b pb-1">施工照片</h1>
                    <div class="mb-3 text-xs">
                        <label class="block font-semibold text-gray-700 mb-0.5">工程名稱：</label>
                        <input type="text" value="${globalProject}" placeholder="請輸入工程名稱" class="project-name-input w-full border border-gray-300 rounded p-1.5 outline-none" oninput="syncProject(this.value)">
                    </div>
                </div>
                <div class="border border-gray-300 rounded overflow-hidden">
                    <table class="w-full border-collapse" style="table-layout: fixed;">
                        <thead>
                            <tr class="bg-gray-100 text-gray-700 text-xs">
                                <th class="border border-gray-300 p-1.5 w-[25%]">階段 / 說明</th>
                                <th class="border border-gray-300 p-1.5 w-[75%]">照片與施工日期</th>
                            </tr>
                        </thead>
                        <tbody class="text-xs">
                            <tr>
                                <td class="border border-gray-300 p-1.5 bg-gray-50 align-top">
                                    <span class="font-bold text-blue-600 block mb-0.5">【施工前】</span>
                                    <textarea rows="2" placeholder="請輸入說明..." class="w-full border border-gray-300 rounded p-1 text-xs outline-none bg-white resize-none" oninput="formData[${pageIndex}].descBefore = this.value"></textarea>
                                </td>
                                <td class="border border-gray-300 p-1.5 space-y-1 align-middle">
                                    <div class="flex items-center gap-1.5 no-print">
                                        <span class="font-semibold text-gray-600 whitespace-nowrap text-xs">日期:</span>
                                        <input type="date" id="date_${pageIndex}_Before" value="${todayStr}" class="border border-gray-300 rounded p-0.5 text-xs outline-none w-full bg-white" onchange="updateDate(${pageIndex}, 'Before', this.value)">
                                    </div>
                                    <div class="no-print">
                                        <input type="file" accept="image/*" class="w-full text-xs" onchange="handleSingleImage(event, ${pageIndex}, 'Before')">
                                    </div>
                                    <div class="text-center">
                                        <canvas id="canvas_${pageIndex}_Before" class="hidden photo-canvas mx-auto rounded border shadow-sm"></canvas>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td class="border border-gray-300 p-1.5 bg-gray-50 align-top">
                                    <span class="font-bold text-yellow-600 block mb-0.5">【施工中】</span>
                                    <textarea rows="2" placeholder="請輸入說明..." class="w-full border border-gray-300 rounded p-1 text-xs outline-none bg-white resize-none" oninput="formData[${pageIndex}].descDuring = this.value"></textarea>
                                </td>
                                <td class="border border-gray-300 p-1.5 space-y-1 align-middle">
                                    <div class="flex items-center gap-1.5 no-print">
                                        <span class="font-semibold text-gray-600 whitespace-nowrap text-xs">日期:</span>
                                        <input type="date" id="date_${pageIndex}_During" value="${todayStr}" class="border border-gray-300 rounded p-0.5 text-xs outline-none w-full bg-white" onchange="updateDate(${pageIndex}, 'During', this.value)">
                                    </div>
                                    <div class="no-print">
                                        <input type="file" accept="image/*" class="w-full text-xs" onchange="handleSingleImage(event, ${pageIndex}, 'During')">
                                    </div>
                                    <div class="text-center">
                                        <canvas id="canvas_${pageIndex}_During" class="hidden photo-canvas mx-auto rounded border shadow-sm"></canvas>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td class="border border-gray-300 p-1.5 bg-gray-50 align-top">
                                    <span class="font-bold text-green-600 block mb-0.5">【施工完】</span>
                                    <textarea rows="2" placeholder="請輸入說明..." class="w-full border border-gray-300 rounded p-1 text-xs outline-none bg-white resize-none" oninput="formData[${pageIndex}].descAfter = this.value"></textarea>
                                </td>
                                <td class="border border-gray-300 p-1.5 space-y-1 align-middle">
                                    <div class="flex items-center gap-1.5 no-print">
                                        <span class="font-semibold text-gray-600 whitespace-nowrap text-xs">日期:</span>
                                        <input type="date" id="date_${pageIndex}_After" value="${todayStr}" class="border border-gray-300 rounded p-0.5 text-xs outline-none w-full bg-white" onchange="updateDate(${pageIndex}, 'After', this.value)">
                                    </div>
                                    <div class="no-print">
                                        <input type="file" accept="image/*" class="w-full text-xs" onchange="handleSingleImage(event, ${pageIndex}, 'After')">
                                    </div>
                                    <div class="text-center">
                                        <canvas id="canvas_${pageIndex}_After" class="hidden photo-canvas mx-auto rounded border shadow-sm"></canvas>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            `;
            container.appendChild(div);
        }

        function handleMultiImages(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            const stages = ['Before', 'During', 'After'];
            const totalPages = Math.ceil(files.length / 3);

            for (let p = 0; p < totalPages; p++) {
                if (!document.querySelector(`[data-page-index="${p}"]`)) {
                    createNewPage(p);
                }
            }

            for (let i = 0; i < files.length; i++) {
                const pageIndex = Math.floor(i / 3);
                const stageIndex = i % 3;
                const stage = stages[stageIndex];
                const file = files[i];

                const reader = new FileReader();
                reader.onload = (function(pIdx, stg) {
                    return function(e) {
                        const img = new Image();
                        img.onload = function() {
                            const data = getPageData(pIdx);
                            data['img' + stg] = img;
                            renderCanvas(pIdx, stg);
                        };
                        img.src = e.target.result;
                    };
                })(pageIndex, stage);
                reader.readAsDataURL(file);
            }
        }

        function handleSingleImage(event, pageIndex, type) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const data = getPageData(pageIndex);
                    data['img' + type] = img;
                    renderCanvas(pageIndex, type);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function renderCanvas(pageIndex, type) {
            const data = getPageData(pageIndex);
            const img = data['img' + type];
            if (!img) return;

            const canvas = document.getElementById(`canvas_${pageIndex}_${type}`);
            const dateInput = document.getElementById(`date_${pageIndex}_${type}`);
            const dateVal = dateInput ? dateInput.value : todayStr;
            data['date' + type] = dateVal;

            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);

            if (dateVal) {
                const fontSize = Math.max(canvas.width * 0.045, 20);
                ctx.font = `bold ${fontSize}px Arial, sans-serif`;
                ctx.fillStyle = '#FFFFFF';
                ctx.shadowColor = '#000000';
                ctx.shadowBlur = 6;
                ctx.lineWidth = 4;

                const metrics = ctx.measureText(dateVal);
                const x = canvas.width - metrics.width - 25;
                const y = canvas.height - 25;

                ctx.strokeText(dateVal, x, y);
                ctx.fillText(dateVal, x, y);
            }

            canvas.classList.remove('hidden');
        }
    </script>

</body>
</html>
