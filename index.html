<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>施工照片紀錄表</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- 引入 html2pdf 庫以支援 PDF 下載 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-gray-100 py-6 px-4">

    <div class="max-w-2xl mx-auto bg-white shadow-lg rounded-xl p-6" id="print-area">
        <!-- 標題 -->
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6 border-b pb-4">施工照片紀錄表</h1>

        <!-- 基本資訊區 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6 text-sm">
            <div>
                <label class="block font-semibold text-gray-700 mb-1">工程名稱：</label>
                <input type="text" id="projectName" placeholder="請輸入工程名稱" class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block font-semibold text-gray-700 mb-1">記錄日期：</label>
                <input type="date" id="checkDate" class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
        </div>

        <!-- 施工前中後表格區塊 -->
        <div class="border border-gray-300 rounded-lg overflow-hidden mb-6">
            <table class="w-full border-collapse">
                <thead>
                    <tr class="bg-gray-200 text-gray-700 text-sm">
                        <th class="border border-gray-300 p-2 w-1/3">階段 / 說明</th>
                        <th class="border border-gray-300 p-2 w-2/3">照片與施工日期</th>
                    </tr>
                </thead>
                <tbody class="text-sm">
                    <!-- 施工前 -->
                    <tr>
                        <td class="border border-gray-300 p-3 bg-gray-50 align-top">
                            <span class="font-bold text-blue-600 block mb-1">【施工前】</span>
                            <textarea id="descBefore" rows="3" placeholder="請輸入施工前說明..." class="w-full border border-gray-300 rounded p-1.5 text-xs outline-none"></textarea>
                        </td>
                        <td class="border border-gray-300 p-3 space-y-2 align-middle">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">施工日期：</label>
                                <input type="date" class="w-full border border-gray-300 rounded p-1 text-xs outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">選擇照片：</label>
                                <input type="file" accept="image/*" class="w-full text-xs file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                            </div>
                        </td>
                    </tr>
                    <!-- 施工中 -->
                    <tr>
                        <td class="border border-gray-300 p-3 bg-gray-50 align-top">
                            <span class="font-bold text-yellow-600 block mb-1">【施工中】</span>
                            <textarea id="descDuring" rows="3" placeholder="請輸入施工中說明..." class="w-full border border-gray-300 rounded p-1.5 text-xs outline-none"></textarea>
                        </td>
                        <td class="border border-gray-300 p-3 space-y-2 align-middle">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">施工日期：</label>
                                <input type="date" class="w-full border border-gray-300 rounded p-1 text-xs outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">選擇照片：</label>
                                <input type="file" accept="image/*" class="w-full text-xs file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-yellow-50 file:text-yellow-700 hover:file:bg-yellow-100">
                            </div>
                        </td>
                    </tr>
                    <!-- 施工完 -->
                    <tr>
                        <td class="border border-gray-300 p-3 bg-gray-50 align-top">
                            <span class="font-bold text-green-600 block mb-1">【施工完】</span>
                            <textarea id="descAfter" rows="3" placeholder="請輸入施工完說明..." class="w-full border border-gray-300 rounded p-1.5 text-xs outline-none"></textarea>
                        </td>
                        <td class="border border-gray-300 p-3 space-y-2 align-middle">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">施工日期：</label>
                                <input type="date" class="w-full border border-gray-300 rounded p-1 text-xs outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">選擇照片：</label>
                                <input type="file" accept="image/*" class="w-full text-xs file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100">
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 下載按鈕區 -->
        <div class="text-center">
            <button onclick="downloadPDF()" class="bg-blue-600 text-white font-bold py-2.5 px-6 rounded-lg shadow hover:bg-blue-700 transition">
                下載 PDF 紀錄表
            </button>
        </div>
    </div>

    <script>
        function downloadPDF() {
            const element = document.getElementById('print-area');
            const opt = {
                margin:       10,
                filename:     '施工照片紀錄表.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().from(element).set(opt).save();
        }
    </script>

</body>
</html>
