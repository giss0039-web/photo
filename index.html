<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工程共融遊具巡檢：PDF導出與GitHub自動備份系統</title>
    <!-- 引入 Bootstrap 5 提供手機版面優化 -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <!-- 引入 html2pdf.js 核心插件，用於手機前端直接將網頁轉存成 PDF -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { background-color: #f8f9fa; font-family: "Microsoft JhengHei", sans-serif; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: none; margin-bottom: 20px; }
        .preview-img { max-width: 100%; max-height: 180px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; margin-top: 10px; }
        .required::after { content: " *"; color: red; }
        
        /* 專門為工程履約 A4 PDF 報告設計的列印排版樣式 */
        #pdfReportLayout { background: #fff; padding: 0; display: none; }
        .report-table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #fff; }
        .report-table th, .report-table td { border: 1px solid #000; padding: 10px; text-align: left; font-size: 14px; vertical-align: top; }
        .report-header { text-align: center; font-weight: bold; font-size: 22px; padding: 10px 0; letter-spacing: 2px; }
        .photo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 15px; }
        .photo-box { border: 1px solid #000; padding: 10px; text-align: center; background: #fff; }
        .photo-box img { max-width: 100%; height: 220px; object-fit: contain; }
        .photo-desc { margin-top: 8px; font-weight: bold; border-top: 1px solid #000; padding-top: 5px; font-size: 13px; }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-dark">工程共融遊具定期檢查表</h2>
        <p class="text-muted">【雙重同步】手機下載 A4 PDF ＋ 自動同步回傳 GitHub 資料庫</p>
    </div>

    <form id="inspectionForm">
        <!-- 一、 基本資料 -->
        <div class="card p-4">
            <h4 class="mb-3 text-secondary border-bottom pb-2">一、 基本資料</h4>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label required">工程名稱</label>
                    <input type="text" class="form-control" id="parkName" value="111年度草屯鎮親子共融遊憩運動公園興建工程" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label required">巡檢日期</label>
                    <input type="date" class="form-control" id="inspectDate" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label required">天氣狀況</label>
                    <select class="form-select" id="weather" required>
                        <option value="晴">晴</option>
                        <option value="陰">陰</option>
                        <option value="雨">雨</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label required">檢查人員</label>
                    <input type="text" class="form-control" id="inspector" placeholder="請輸入姓名" required>
                </div>
            </div>
        </div>

        <!-- 二、 設施類別 -->
        <div class="card p-4">
            <h4 class="mb-3 text-secondary border-bottom pb-2">二、 巡檢設施類別</h4>
            <div class="mb-3">
                <label class="form-label required">請選擇本次欲檢查的遊具設施</label>
                <select class="form-select" id="facilityType" onchange="switchFacilitySection()" required>
                    <option value="">-- 請選擇 --</option>
                    <option value="PN">[PN] 攀爬架/攀爬設備</option>
                    <option value="SY">[SY] 旋轉盤</option>
                    <option value="DA">[DA] 單槓</option>
                    <option value="DI">[DI] 橡膠地墊及無縫地墊</option>
                </select>
            </div>
        </div>

        <!-- 動態細項項目 (隨選單動態顯示) -->
        <div id="section_PN" class="card p-4 d-none">
            <h4 class="mb-3 text-success border-bottom pb-2">[PN] 攀爬架 檢查項目</h4>
            <div class="mb-3">
                <label class="form-label fw-bold">1. 遊具鋼構情形</label>
                <div>
                    <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="pn_1" value="正常" checked><label class="form-check-label">正常</label></div>
                    <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="pn_1" value="脫漆"><label class="form-check-label">脫漆</label></div>
                    <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="pn_1" value="鏽蝕"><label class="form-check-label">鏽蝕</label></div>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">2. 遊具結合螺栓情形</label>
                <div>
                    <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="pn_2" value="正常" checked><label class="form-check-label">正常</label></div>
                    <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="pn_2" value="鬆脫"><label class="form-check-label">鬆脫</label></div>
                </div>
            </div>
        </div>

        <div id="section_SY" class="card p-4 d-none">
            <h4 class="mb-3 text-success border-bottom pb-2">[SY] 旋轉盤 檢查項目</h4>
            <div class="mb-3">
                <label class="form-label fw-bold">1. 旋轉盤情形</label>
                <div>
                    <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="sy_1" value="正常" checked><label class="form-check-label">正常</label></div>
                    <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="sy_1" value="旋轉不順"><label class="form-check-label">旋轉不順</label></div>
                </div>
            </div>
        </div>

        <div id="section_DA" class="card p-4 d-none">
            <h4 class="mb-3 text-success border-bottom pb-2">[DA] 單槓 檢查項目</h4>
            <div class="mb-3">
                <label class="form-label fw-bold">1. 鋼構漆面情形</label>
                <div>
                    <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="da_1" value="無掉漆" checked><label class="form-check-label">無掉漆</label></div>
                    <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="da_1" value="已有部分掉漆"><label class="form-check-label">已有部分掉漆</label></div>
                </div>
            </div>
        </div>

        <div id="section_DI" class="card p-4 d-none">
            <h4 class="mb-3 text-success border-bottom pb-2">[DI] 橡膠地墊及無縫地墊 檢查項目</h4>
            <div class="mb-3">
                <label class="form-label fw-bold">1. 地墊及收邊是否破損</label>
                <div>
                    <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="di_1" value="正常" checked><label class="form-check-label">正常</label></div>
                    <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="di_1" value="破損"><label class="form-check-label">破損</label></div>
                </div>
            </div>
        </div>

        <!-- 三、 照片紀錄 -->
        <div class="card p-4">
            <h4 class="mb-3 text-secondary border-bottom pb-2">三、 現場照片上傳</h4>
            <div class="mb-3">
                <label class="form-label required">拍照或上傳現場照片（可多張，手機會自動啟動相機）</label>
                <input type="file" class="form-control" id="photoInput" accept="image/*" multiple onchange="previewImages()" required>
            </div>
            <div id="imagePreviewContainer" class="row g-2"></div>
        </div>

        <!-- 備註與送出 -->
        <div class="card p-4">
            <div class="mb-3">
                <label class="form-label">備註說明 / 缺失補充</label>
                <textarea class="form-control" id="remark" rows="3" placeholder="若有特殊缺失請在此備註..."></textarea>
            </div>
            <button type="submit" id="submitBtn" class="btn btn-primary btn-lg w-100">一鍵搞定：存成 PDF ＋ 上傳 GitHub</button>
        </div>
    </form>
</div>

<!-- ========================================== -->
<!-- 📑 PDF 隱藏排版區（專門用來轉成正式 A4 PDF 報表） -->
<!-- ========================================== -->
<div id="pdfReportLayout">
    <div class="report-header">巡檢維護紀錄照片表</div>
    <table class="report-table">
        <tr><td style="width: 15%; font-weight: bold; background: #f2f2f2;">工程名稱</td><td id="pdf_parkName" style="width: 45%;"></td><td style="width: 15%; font-weight: bold; background: #f2f2f2;">巡檢日期</td><td id="pdf_date" style="width: 25%;"></td></tr>
        <tr><td style="font-weight: bold; background: #f2f2f2;">檢查人員</td><td id="pdf_inspector"></td><td style="font-weight: bold; background: #f2f2f2;">天氣狀況</td><td id="pdf_weather"></td></tr>
        <tr><td style="font-weight: bold; background: #f2f2f2;">設施類別</td><td id="pdf_facility" colspan="3" style="font-weight: bold; color: #0d6efd;"></td></tr>
        <tr><td style="font-weight: bold; background: #f2f2f2;">檢查結果摘要</td><td id="pdf_results" colspan="3"></td></tr>
        <tr><td style="font-weight: bold; background: #f2f2f2;">備註說明</td><td id="pdf_remark" colspan="3"></td></tr>
    </table>
    <div id="pdf_photoGrid" class="photo-grid"></div>
</div>

<script>
    // ⚠️ 填入您的 GitHub 自動化金鑰設定
    const GISS_CONFIG = {
        token: "請在此處貼上您的_ghp_通行金鑰", // 👈 貼上您剛剛複製存好的 ghp_ 開頭金鑰
        username: "giss0039-web",
        repo: "playground-data"          // 👈 指向您剛剛建立的全新資料庫儲存庫（亦可改回 "photo"）
    };

    document.getElementById('inspectDate').value = new Date().toISOString().split('T')[0];

    function switchFacilitySection() {
