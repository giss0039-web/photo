<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>施工照片</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- html2pdf.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @media print {
            body { background: white; padding: 0; margin: 0; }
            .page-container { box-shadow: none !important; margin: 0 !important; padding: 10mm !important; page-break-after: always; break-after: page; }
            .no-print { display: none !important; }
            input, textarea { border: none !important; background: transparent !important; resize: none !important; }
            table { page-break-inside: auto; }
            tr { page-break-inside: avoid; break-inside: avoid; }
        }
        /* 讓照片完全填滿右側格子 */
        .photo-canvas {
            width: 100% !important;
            height: auto !important;
            max-height: 280px;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body class="bg-gray-100 py-4 px-2">

    <!-- 主容器（如果有多頁需求，可複製多個 .page-container 區塊） -->
    <div class="page-container max-w-2xl mx-auto bg-white shadow-lg rounded-xl p-4 sm:p-6 mb-6" id="print-area">
        <!-- 標題 -->
        <h1 class="text-xl font-bold text-center text-gray-800 mb-3 border-b pb-2">施工照片記錄表</h1>

        <!-- 基本資訊區 -->
        <div class="mb-4 text-xs sm:text-sm">
            <label class="block font-semibold text-gray-700 mb-1">工程名稱：</label>
            <input type="text" id="projectName" placeholder="請輸入工程名稱" class="w-full border border-gray-300 rounded p-1.5 focus:ring-1 focus:ring-blue-500 outline-none">
        </div>

        <!-- 一次選取 3 張照片的快捷按鈕 -->
        <div class="mb-4 p-3 bg-blue-50 border border-blue-200 rounded-lg flex items-center justify-between no-print">
            <div>
                <span class="font-bold text-blue-800 text-xs sm:text-sm block">💡 快速匯入：</span>
                <span class="text-xs text-blue-600">點擊右側按鈕，可從相簿「一次選取 3 張照片」自動填入前、中、後！</span>
            </div>
            <label class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-3 rounded text-xs cursor-pointer shadow whitespace-nowrap">
                一次選 3 張照片
                <input type="file" id="batchFiles" accept="image/*" multiple class="hidden" onchange="handleBatchImages(event)">
            </label>
        </div>

        <!-- 施工表格區塊 (左窄右寬、照片填滿) -->
        <div class="border border-gray-300 rounded overflow-hidden mb-4">
            <table class="w-full border-collapse" style="table-layout: fixed;">
                <thead>
                    <tr class="bg-gray-100 text-gray-700 text-xs">
                        <!-- 左側欄位縮小 (25%)，右側照片欄位放大 (75%) -->
                        <th class="border border-gray-300 p-1.5 w-[25%]">階段 / 說明</th>
                        <th class="border border-gray-300 p-1.5 w-[75%]">照片與施工日期</th>
                    </tr>
                </thead>
                <tbody class="text-xs">
                    <!-- 施工前 -->
                    <tr>
                        <td class="border border-gray-300 p-2 bg-gray-50 align-top">
                            <span class="font-bold text-blue-600 block mb-1">【施工前】</span>
                            <textarea id="descBefore" rows="4" placeholder="請輸入施工前說明..." class="w-full border border-gray-300 rounded p-1 text-xs outline-none bg-white relative z-10 resize-none"></textarea>
                        </td>
                        <td class="border border-gray-300 p-2 space-y-1.5 align-middle">
                            <div class="flex items-center gap-2 no-print">
                                <span class="font-semibold text-gray-600 whitespace-nowrap text-xs">日期:</span>
                                <input type="date" id="dateBefore" class="border border-gray-300 rounded p-1 text-xs outline-none w-full bg-white" onchange="updateWatermark('Before')">
                            </div>
                            <div class="no-print">
                                <input type="file" id="fileBefore" accept="image/*" class="w-full text-xs" onchange="handleSingleImage(event, 'Before')">
                            </div>
                            <div class="text-center">
                                <canvas id="canvasBefore" class="hidden photo-canvas mx-auto rounded border shadow-sm"></canvas>
                            </div>
                        </td>
                    </tr>
                    <!-- 施工中 -->
                    <tr>
                        <td class="border border-gray-300 p-2 bg-gray-50 align-top">
                            <span class="font-bold text-yellow-600 block mb-1">【施工中】</span>
                            <textarea id="descDuring" rows="4" placeholder="請輸入施工中說明..." class="w-full border border-gray-300 rounded p-1 text-xs outline-none bg-white relative z-10 resize-none"></textarea>
                        </td>
                        <td class="border border-gray-300 p-2 space-y-1.5 align-middle">
                            <div class="flex items-center gap-2 no-print">
                                <span class="font-semibold text-gray-600 whitespace-nowrap text-xs">日期:</span>
                                <input type="date" id="dateDuring" class="border border-gray-300 rounded p-1 text-xs outline-none w-full bg-white" onchange="updateWatermark('During')">
                            </div>
                            <div class="no-print">
                                <input type="file" id="fileDuring" accept="image/*" class="w-full text-xs" onchange="handleSingleImage(event, 'During')">
                            </div>
                            <div class="text-center">
                                <canvas id="canvasDuring" class="hidden photo-canvas mx-auto rounded border shadow-sm"></canvas>
                            </div>
                        </td>
                    </tr>
                    <!-- 施工完 -->
                    <tr>
                        <td class="border border-gray-300 p-2 bg-gray-50 align-top">
                            <span class="font-bold text-green-600 block mb-1">【施工完】</span>
                            <textarea id="descAfter" rows="4" placeholder="請輸入施工完說明..." class="w-full border border-gray-300 rounded p-1 text-xs outline-none bg-white relative z-10 resize-none"></textarea>
                        </td>
                        <td class="border border-gray-300 p-2 space-y-1.5 align-middle">
                            <div class="flex items-center gap-2 no-print">
                                <span class="font-semibold text-gray-600 whitespace-nowrap text-xs">日期:</span>
                                <input type="date" id="dateAfter" class="border border-gray-300 rounded p-1 text-xs outline-none w-full bg-white" onchange="updateWatermark('After')">
                            </div>
                            <div class="no-print">
                                <input type="file" id="fileAfter" accept="image/*" class="w-full text-xs" onchange="handleSingleImage(event, 'After')">
                            </div>
                            <div class="text-center">
                                <canvas id="canvasAfter" class="hidden photo-canvas mx-auto rounded border shadow-sm"></canvas>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 按鈕區 -->
        <div class="text-center space-x-2 no-print">
            <button onclick="generatePDF()" class="bg-blue-600 text-white font-bold py-2 px-5 rounded shadow hover:bg-blue-700 text-sm transition">
                下載單頁 PDF
            </button>
            <button onclick="window.print()" class="bg-gray-600 text-white font-bold py-2 px-4 rounded shadow hover:bg-gray-700 text-sm transition">
                系統列印 (多頁自動換頁)
            </button>
        </div>
    </div>

    <script>
        const imageObjects = { Before: null, During: null, After: null };
        const keys = ['Before', 'During', 'After'];

        function handleBatchImages(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            for (let i = 0; i < Math.min(files.length, 3); i++) {
                const type = keys[i];
                const file = files[i];
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        imageObjects[type] = img;
                        drawImageWithWatermark(type);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function handleSingleImage(event, type) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    imageObjects[type] = img;
                    drawImageWithWatermark(type);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function updateWatermark(type) {
            if (imageObjects[type]) {
                drawImageWithWatermark(type);
            }
        }

        function drawImageWithWatermark(type) {
            const img = imageObjects[type];
            const canvas = document.getElementById('canvas' + type);
            const dateInput = document.getElementById('date' + type).value;
            const ctx = canvas.getContext('2d');

            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);

            if (dateInput) {
                const fontSize = Math.max(canvas.width * 0.045, 20);
                ctx.font = `bold ${fontSize}px Arial, sans-serif`;
                ctx.fillStyle = '#FFFFFF';
                ctx.shadowColor = '#000000';
                ctx.shadowBlur = 6;
                ctx.lineWidth = 4;

                const text = dateInput;
                const metrics = ctx.measureText(text);
                const x = canvas.width - metrics.width - 25;
                const y = canvas.height - 25;

                ctx.strokeText(text, x, y);
                ctx.fillText(text, x, y);
            }

            canvas.classList.remove('hidden');
        }

        function generatePDF() {
            const element = document.getElementById('print-area');
            const projectName = document.getElementById('projectName').value || '施工照片';
            
            const opt = {
                margin:       [4, 4, 4, 4],
                filename:     `${projectName}.pdf`,
                image:        { type: 'jpeg', quality: 0.92 },
                html2canvas:  { scale: 2, useCORS: true, logging: false },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save().catch(() => {
                window.print();
            });
        }
    </script>

</body>
</html>
