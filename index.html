<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>施工照片</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- html2pdf.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @media print {
            body { background: white; padding: 0; margin: 0; }
            #print-area { box-shadow: none; max-width: 100%; padding: 0; }
            .no-print { display: none !important; }
            input, textarea { border: none !important; background: transparent !important; }
            tr { page-break-inside: avoid; }
        }
    </style>
</head>
<body class="bg-gray-100 py-3 px-2">

    <div class="max-w-2xl mx-auto bg-white shadow-lg rounded-xl p-4" id="print-area">
        <!-- 標題 -->
        <h1 class="text-xl font-bold text-center text-gray-800 mb-3 border-b pb-2">施工照片</h1>

        <!-- 基本資訊區 -->
        <div class="mb-3 text-xs sm:text-sm">
            <label class="block font-semibold text-gray-700 mb-1">工程名稱：</label>
            <input type="text" id="projectName" placeholder="請輸入工程名稱" class="w-full border border-gray-300 rounded p-1.5 focus:ring-1 focus:ring-blue-500 outline-none">
        </div>

        <!-- 施工表格區塊 (擴充至 9 張照片，前中後各 3 組) -->
        <div class="border border-gray-300 rounded overflow-hidden mb-3">
            <table class="w-full border-collapse">
                <thead>
                    <tr class="bg-gray-100 text-gray-700 text-xs">
                        <th class="border border-gray-300 p-1.5 w-1/3">階段 / 說明</th>
                        <th class="border border-gray-300 p-1.5 w-2/3">照片與施工日期</th>
                    </tr>
                </thead>
                <tbody class="text-xs">
                    <!-- 施工前 (3組) -->
                    <script>
                        function renderRows(typeTitle, typeKey, colorClass) {
                            let html = '';
                            for(let i=1; i<=3; i++) {
                                html += `
                                <tr>
                                    ${i === 1 ? `<td rowspan="3" class="border border-gray-300 p-2 bg-gray-50 align-top">
                                        <span class="font-bold ${colorClass} block mb-1">【${typeTitle}】</span>
                                        <textarea id="desc${typeKey}" rows="4" placeholder="請輸入${typeTitle}說明..." class="w-full border border-gray-300 rounded p-1 text-xs outline-none bg-white relative z-10"></textarea>
                                    </td>` : ''}
                                    <td class="border border-gray-300 p-1.5 space-y-1 align-middle">
                                        <div class="flex items-center gap-2 no-print">
                                            <span class="font-semibold text-gray-600 whitespace-nowrap text-[11px]">日期${i}:</span>
                                            <input type="date" id="date${typeKey}${i}" class="border border-gray-300 rounded p-1 text-xs outline-none w-full bg-white" onchange="updateWatermark('${typeKey}', ${i})">
                                        </div>
                                        <div class="no-print">
                                            <input type="file" id="file${typeKey}${i}" accept="image/*" class="w-full text-[11px]" onchange="handleImage(event, '${typeKey}', ${i})">
                                        </div>
                                        <div class="text-center mt-1">
                                            <canvas id="canvas${typeKey}${i}" class="hidden max-h-24 mx-auto rounded border shadow-sm"></canvas>
                                        </div>
                                    </td>
                                </tr>`;
                            }
                            document.write(html);
                        }
                    </script>
                    
                    <script>renderRows('施工前', 'Before', 'text-blue-600');</script>
                    <script>renderRows('施工中', 'During', 'text-yellow-600');</script>
                    <script>renderRows('施工完', 'After', 'text-green-600');</script>
                </tbody>
            </table>
        </div>

        <!-- 按鈕區 -->
        <div class="text-center space-x-2 no-print">
            <button onclick="generatePDF()" class="bg-blue-600 text-white font-bold py-2 px-5 rounded shadow hover:bg-blue-700 text-sm transition">
                下載單頁 PDF
            </button>
            <button onclick="window.print()" class="bg-gray-600 text-white font-bold py-2 px-4 rounded shadow hover:bg-gray-700 text-sm transition">
                系統列印
            </button>
        </div>
    </div>

    <script>
        const imageObjects = {};

        function handleImage(event, type, index) {
            const file = event.target.files[0];
            if (!file) return;
            const key = type + index;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    imageObjects[key] = img;
                    drawImageWithWatermark(type, index);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function updateWatermark(type, index) {
            const key = type + index;
            if (imageObjects[key]) {
                drawImageWithWatermark(type, index);
            }
        }

        function drawImageWithWatermark(type, index) {
            const key = type + index;
            const img = imageObjects[key];
            const canvas = document.getElementById('canvas' + key);
            const dateInput = document.getElementById('date' + key).value;
            const ctx = canvas.getContext('2d');

            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);

            if (dateInput) {
                const fontSize = Math.max(canvas.width * 0.045, 20);
                ctx.font = `bold ${fontSize}px Arial, sans-serif`;
                ctx.fillStyle = '#FFFFFF';
                ctx.shadowColor = '#000000';
                ctx.shadowBlur = 6;
                ctx.lineWidth = 4;

                const text = dateInput;
                const metrics = ctx.measureText(text);
                const x = canvas.width - metrics.width - 25;
                const y = canvas.height - 25;

                ctx.strokeText(text, x, y);
                ctx.fillText(text, x, y);
            }

            canvas.classList.remove('hidden');
        }

        function generatePDF() {
            const element = document.getElementById('print-area');
            const projectName = document.getElementById('projectName').value || '施工照片';
            
            const opt = {
                margin:       [4, 4, 4, 4],
                filename:     `${projectName}.pdf`,
                image:        { type: 'jpeg', quality: 0.92 },
                html2canvas:  { scale: 2, useCORS: true, logging: false },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save().catch(() => {
                window.print();
            });
        }
    </script>

</body>
</html>
