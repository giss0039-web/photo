<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>施工照片紀錄表</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 py-6 px-4">

    <div class="max-w-2xl mx-auto bg-white shadow-lg rounded-xl p-6" id="print-area">
        <!-- 標題 -->
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6 border-b pb-4">施工照片紀錄表</h1>

        <!-- 基本資訊區 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6 text-sm">
            <div>
                <label class="block font-semibold text-gray-700 mb-1">工程名稱：</label>
                <input type="text" id="projectName" placeholder="請輸入工程名稱" class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block font-semibold text-gray-700 mb-1">記錄日期：</label>
                <input type="date" id="checkDate" class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
        </div>

        <!-- 施工前中後表格區塊 -->
        <div class="border border-gray-300 rounded-lg overflow-hidden mb-6">
            <table class="w-full border-collapse">
                <thead>
                    <tr class="bg-gray-200 text-gray-700 text-sm">
                        <th class="border border-gray-300 p-2 w-1/3">階段 / 說明</th>
                        <th class="border border-gray-300 p-2 w-2/3">照片與施工日期</th>
                    </tr>
                </thead>
                <tbody class="text-sm">
                    <!-- 施工前 -->
                    <tr>
                        <td class="border border-gray-300 p-3 bg-gray-50 align-top">
                            <span class="font-bold text-blue-600 block mb-1">【施工前】</span>
                            <textarea id="descBefore" rows="4" placeholder="請輸入施工前說明..." class="w-full border border-gray-300 rounded p-2 text-xs outline-none bg-white relative z-10"></textarea>
                        </td>
                        <td class="border border-gray-300 p-3 space-y-2 align-middle">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">施工日期：</label>
                                <input type="date" id="dateBefore" class="w-full border border-gray-300 rounded p-1 text-xs outline-none bg-white" onchange="updateWatermark('Before')">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">選擇照片：</label>
                                <input type="file" id="fileBefore" accept="image/*" class="w-full text-xs" onchange="handleImage(event, 'Before')">
                            </div>
                            <div class="relative inline-block mt-2 max-w-full">
                                <canvas id="canvasBefore" class="hidden max-w-full rounded border"></canvas>
                            </div>
                        </td>
                    </tr>
                    <!-- 施工中 -->
                    <tr>
                        <td class="border border-gray-300 p-3 bg-gray-50 align-top">
                            <span class="font-bold text-yellow-600 block mb-1">【施工中】</span>
                            <textarea id="descDuring" rows="4" placeholder="請輸入施工中說明..." class="w-full border border-gray-300 rounded p-2 text-xs outline-none bg-white relative z-10"></textarea>
                        </td>
                        <td class="border border-gray-300 p-3 space-y-2 align-middle">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">施工日期：</label>
                                <input type="date" id="dateDuring" class="w-full border border-gray-300 rounded p-1 text-xs outline-none bg-white" onchange="updateWatermark('During')">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">選擇照片：</label>
                                <input type="file" id="fileDuring" accept="image/*" class="w-full text-xs" onchange="handleImage(event, 'During')">
                            </div>
                            <div class="relative inline-block mt-2 max-w-full">
                                <canvas id="canvasDuring" class="hidden max-w-full rounded border"></canvas>
                            </div>
                        </td>
                    </tr>
                    <!-- 施工完 -->
                    <tr>
                        <td class="border border-gray-300 p-3 bg-gray-50 align-top">
                            <span class="font-bold text-green-600 block mb-1">【施工完】</span>
                            <textarea id="descAfter" rows="4" placeholder="請輸入施工完說明..." class="w-full border border-gray-300 rounded p-2 text-xs outline-none bg-white relative z-10"></textarea>
                        </td>
                        <td class="border border-gray-300 p-3 space-y-2 align-middle">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">施工日期：</label>
                                <input type="date" id="dateAfter" class="w-full border border-gray-300 rounded p-1 text-xs outline-none bg-white" onchange="updateWatermark('After')">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">選擇照片：</label>
                                <input type="file" id="fileAfter" accept="image/*" class="w-full text-xs" onchange="handleImage(event, 'After')">
                            </div>
                            <div class="relative inline-block mt-2 max-w-full">
                                <canvas id="canvasAfter" class="hidden max-w-full rounded border"></canvas>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 下載按鈕區 -->
        <div class="text-center">
            <button onclick="window.print()" class="bg-blue-600 text-white font-bold py-2.5 px-6 rounded-lg shadow hover:bg-blue-700 transition">
                列印 / 存成 PDF 檔
            </button>
        </div>
    </div>

    <script>
        const imageObjects = { Before: null, During: null, After: null };

        function handleImage(event, type) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    imageObjects[type] = img;
                    drawImageWithWatermark(type);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function updateWatermark(type) {
            if (imageObjects[type]) {
                drawImageWithWatermark(type);
            }
        }

        function drawImageWithWatermark(type) {
            const img = imageObjects[type];
            const canvas = document.getElementById('canvas' + type);
            const dateInput = document.getElementById('date' + type).value;
            
            const ctx = canvas.getContext('2d');
            canvas.width = img.width;
            canvas.height = img.height;
            
            ctx.drawImage(img, 0, 0);

            if (dateInput) {
                const fontSize = Math.max(canvas.width * 0.04, 24);
                ctx.font = `bold ${fontSize}px Arial, sans-serif`;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                ctx.shadowBlur = 6;
                ctx.lineWidth = 4;
                
                const text = dateInput;
                const metrics = ctx.measureText(text);
                const x = canvas.width - metrics.width - 20;
                const y = canvas.height - 20;

                ctx.strokeText(text, x, y);
                ctx.fillText(text, x, y);
            }

            canvas.classList.remove('hidden');
        }
    </script>

</body>
</html>
