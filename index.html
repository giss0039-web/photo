<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>施工照片報告</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @page {
            size: A4 portrait;
            margin: 0;
        }
        @media print {
            body { background: white; padding: 0; margin: 0; }
            .no-print { display: none !important; }
            input, textarea { border: none !important; background: transparent !important; resize: none !important; }
            .page-container {
                box-shadow: none !important;
                margin: 0 !important;
                padding: 6mm !important;
                height: 297mm !important;
                page-break-after: always;
                break-after: page;
            }
        }
        .page-container {
            page-break-after: always;
            break-after: page;
            box-sizing: border-box;
            width: 210mm;
            height: 297mm;
            margin: 0 auto 5mm auto;
            background: white;
            padding: 6mm;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        /* 移除照片外框與陰影，呈現乾淨畫面 */
        .photo-canvas {
            width: 100% !important;
            height: 135px !important;
            max-height: 135px !important;
            object-fit: contain;
            display: block;
            margin: 0 auto;
            background: #ffffff;
            border: none !important;
            box-shadow: none !important;
        }
    </style>
</head>
<body class="bg-gray-100 py-2 px-2">

    <!-- 全域控制列 (不印出) -->
    <div class="max-w-2xl mx-auto mb-3 p-3 bg-white shadow rounded-xl no-print space-y-2">
        <h1 class="text-base font-bold text-center text-gray-800">施工照片產生器</h1>
        <div class="p-2.5 bg-blue-50 border border-blue-200 rounded-lg flex items-center justify-between">
            <div>
                <span class="font-bold text-blue-800 text-xs block">💡 批次上傳多張照片：</span>
                <span class="text-xs text-blue-600">工程名稱與廠商打一次自動同步，施作項目與照片每頁獨立！</span>
            </div>
            <label class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-1.5 px-3 rounded text-xs cursor-pointer shadow whitespace-nowrap">
                選擇多張照片
                <input type="file" id="multiFiles" accept="image/*" multiple class="hidden" onchange="handleBatchImages(event)">
            </label>
        </div>
        <div class="flex justify-center gap-2">
            <button onclick="window.print()" class="w-full bg-blue-600 text-white font-bold py-3 px-6 rounded-lg shadow-lg hover:bg-blue-700 text-sm transition">
                🖨️ 點我列印 / 存成 PDF 檔案
            </button>
        </div>
    </div>

    <!-- 輸出列印區域 -->
    <div id="print-area"></div>

    <script>
        const todayStr = new Date().toISOString().split('T')[0];
        let globalProject = '';
        let globalVendor = '';
        let pagesData = [];

        pagesData.push({
            item: '',
            dateBefore: todayStr, imgBefore: null,
            dateDuring: todayStr, imgDuring: null,
            dateAfter: todayStr, imgAfter: null
        });

        function renderAllPages() {
            const container = document.getElementById('print-area');
            container.innerHTML = '';

            pagesData.forEach((data, pIdx) => {
                const div = document.createElement('div');
                div.className = 'page-container shadow-lg rounded-xl';
                div.innerHTML = `
                    <div class="border border-gray-400 rounded overflow-hidden w-full h-full flex flex-col justify-between bg-white">
                        <!-- 表頭區域 -->
                        <table class="w-full border-collapse text-xs" style="table-layout: fixed;">
                            <thead>
                                <tr>
                                    <th colspan="2" class="border-b border-gray-400 p-1.5 text-center text-sm font-bold bg-gray-50 tracking-widest">施 工 照 片 (第 ${pIdx + 1} 頁)</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td class="border-r border-b border-gray-400 p-1.5 font-semibold bg-gray-50 w-[22%] text-center">工程名稱</td>
                                    <td class="border-b border-gray-400 p-1.5">
                                        <input type="text" value="${globalProject}" placeholder="請輸入工程名稱" class="w-full outline-none bg-transparent" oninput="syncGlobalProject(this.value)">
                                    </td>
                                </tr>
                                <tr>
                                    <td class="border-r border-b border-gray-400 p-1.5 font-semibold bg-gray-50 text-center">承攬廠商</td>
                                    <td class="border-b border-gray-400 p-1.5">
                                        <input
